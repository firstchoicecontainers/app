<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>First Choice Containers</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
    }

    /* =========================
       LOADING SCREEN
       ========================= */

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: Arial, sans-serif;
      transition: opacity 0.4s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
    }

    .company {
      font-size: 23px;
      font-weight: bold;
      white-space: nowrap;
    }

    .first-choice {
      color: #0B1F4D;
    }

    .containers {
      color: #D71920;
    }

    .loading-text {
      margin-top: 9px;
      font-size: 13px;
      color: #777;
    }

    .account-picker {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
      line-height: 1.6;
    }

    .account-picker a {
      text-decoration: none;
      margin: 0 3px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .account-picker a:hover {
      background: #f0f0f0;
    }

    .account-picker a.active {
      color: #0B1F4D;
      font-weight: 700;
      background: #eaf1f8;
    }

    .account-picker a.inactive {
      color: #D71920;
      font-weight: 400;
    }

    /* =========================
       APP
       ========================= */

    .app-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {
      iframe {
        width: 105.3%;
        height: 105.3%;
        min-height: 105.3%;
        transform: scale(0.95);
        transform-origin: top left;
      }

      .company {
        font-size: 20px;
      }

      .loading-text {
        font-size: 12px;
      }
    }

    /* =========================
       SMALL PHONES
       ========================= */

    @media (max-width: 480px) {
      iframe {
        width: 111.2%;
        height: 111.2%;
        min-height: 111.2%;
        transform: scale(0.90);
        transform-origin: top left;
      }

      .company {
        font-size: 18px;
      }

      .loading-text {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-content">
      <div class="company">
        <span class="first-choice">First Choice</span>
        <span class="containers">Containers</span>
      </div>
      <div class="loading-text">
        Loading Quote Builder...
      </div>
      <div class="account-picker" id="accountPicker"></div>
    </div>
  </div>

  <!-- Application -->
  <div class="app-container">
    <iframe
      id="appFrame"
      allow="clipboard-write"
      title="First Choice Containers">
    </iframe>
  </div>

  <script>
    (function () {
      var appFrame = document.getElementById("appFrame");
      var loading = document.getElementById("loading");
      var picker = document.getElementById("accountPicker");

      // ---- 1. Read authuser from wrapper URL (default to 0) ----
      var params = new URLSearchParams(window.location.search);
      var authuser = params.get("authuser") || "0";

      // ---- 2. Build iframe src with forced account ----
      var baseUrl = "https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec";
      var finalUrl = baseUrl + "?authuser=" + encodeURIComponent(authuser);
      appFrame.src = finalUrl;

      // ---- 3. Hide loader when iframe loads ----
      appFrame.onload = function () {
        loading.classList.add("hide");
        setTimeout(function () {
          loading.style.display = "none";
        }, 400);
      };

      // ---- 4. Build account fallback links on loading screen ----
      var currentPath = window.location.pathname;
      var accounts = [
        { label: "Account 1", val: "0" },
        { label: "Account 2", val: "1" },
        { label: "Account 3", val: "2" }
      ];

      var html = "App not loading? Try: ";
      for (var i = 0; i < accounts.length; i++) {
        var isActive = authuser === accounts[i].val;
        var cls = isActive ? "active" : "inactive";
        var href = currentPath + "?authuser=" + accounts[i].val;
        html += (i > 0 ? " | " : "") +
          '<a href="' + href + '" class="' + cls + '">' + accounts[i].label + "</a>";
      }

      picker.innerHTML = html;
    })();
  </script>

</body>
</html>
