<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>First Choice Containers</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .loading-content {
      text-align: center;
    }

    .company {
      font-size: 23px;
      font-weight: bold;
      white-space: nowrap;
    }

    .first-choice {
      color: #0B1F4D;
    }

    .containers {
      color: #D71920;
    }

    .loading-text {
      margin-top: 9px;
      font-size: 13px;
      color: #777;
    }

    .account-picker {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
      line-height: 1.6;
    }

    .account-picker a {
      text-decoration: none;
      margin: 0 3px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .account-picker a:hover {
      background: #f0f0f0;
    }

    .account-picker a.active {
      color: #0B1F4D;
      font-weight: 700;
      background: #eaf1f8;
    }

    .account-picker a.inactive {
      color: #D71920;
      font-weight: 400;
    }

    @media (max-width: 768px) {
      .company {
        font-size: 20px;
      }

      .loading-text {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="loading-content">
    <div class="company">
      <span class="first-choice">First Choice</span>
      <span class="containers">Containers</span>
    </div>
    <div class="loading-text">
      Opening Quote Builder...
    </div>
    <div class="account-picker" id="accountPicker"></div>
  </div>

  <script>
    (function () {
      var picker = document.getElementById("accountPicker");

      // ---- 1. Read authuser from wrapper URL (default to 0) ----
      var params = new URLSearchParams(window.location.search);
      var authuser = params.get("authuser") || "0";

      // ---- 2. Build the real app URL with the account forced ----
      var baseUrl = "https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec";
      var finalUrl = baseUrl + "?authuser=" + encodeURIComponent(authuser);

      // ---- 3. Full top-level navigation - no iframe, no cross-origin
      //         cookie issue, so the "Drive cannot load this file" error
      //         from multi-login sessions doesn't happen here. ----
      window.location.replace(finalUrl);

      // ---- 4. Account fallback links, shown in case the redirect landed
      //         on the wrong account and the user needs to retry. ----
      var currentPath = window.location.pathname;
      var accounts = [
        { label: "Account 1", val: "0" },
        { label: "Account 2", val: "1" },
        { label: "Account 3", val: "2" }
      ];

      var html = "Not loading, or wrong account? Try: ";
      for (var i = 0; i < accounts.length; i++) {
        var isActive = authuser === accounts[i].val;
        var cls = isActive ? "active" : "inactive";
        var href = currentPath + "?authuser=" + accounts[i].val;
        html += (i > 0 ? " | " : "") +
          '<a href="' + href + '" class="' + cls + '">' + accounts[i].label + "</a>";
      }

      picker.innerHTML = html;
    })();
  </script>

</body>
</html>
