<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>First Choice Containers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    /* =========================
       APP CONTAINER
       ========================= */

    .app-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;

      border: 0;
      margin: 0;
      padding: 0;
    }

    /* =========================
       LOADING SCREEN
       ========================= */

    #loading {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100dvh;

      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 999999;

      font-family: Arial, Helvetica, sans-serif;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.4s ease,
        visibility 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================
       COMPANY NAME
       ========================= */

    .company-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-align: center;
      line-height: 1.2;
    }

    .first-choice {
      color: #0b1f4d;
    }

    .containers {
      color: #d71920;
    }

    /* =========================
       LOADING TEXT
       ========================= */

    .loading-text {
      margin-top: 10px;

      font-size: 13px;
      font-weight: 400;

      color: #777;

      text-align: center;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      body {
        height: 100dvh;
      }

      .app-container {
        width: 100%;
        height: 100dvh;
      }

      iframe {
        width: 105.3%;
        height: 105.3%;
        min-height: 105.3%;

        transform: scale(0.95);
        transform-origin: top left;
      }

      .company-name {
        font-size: 21px;
      }

      .loading-text {
        font-size: 12px;
      }
    }

    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 480px) {

      iframe {
        width: 111.2%;
        height: 111.2%;
        min-height: 111.2%;

        transform: scale(0.90);
        transform-origin: top left;
      }

      .company-name {
        font-size: 19px;
      }

      .loading-text {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOADING SCREEN
       ========================= -->

  <div id="loading">

    <div>

      <div class="company-name">
        <span class="first-choice">First Choice</span>
        <span class="containers">Containers</span>
      </div>

      <div class="loading-text">
        Loading Quote Builder...
      </div>

    </div>

  </div>


  <!-- =========================
       APPLICATION
       ========================= -->

  <div class="app-container">

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec"
      allow="clipboard-write"
      title="First Choice Containers"
      loading="eager">
    </iframe>

  </div>


  <!-- =========================
       LOADING SCRIPT
       ========================= -->

  <script>
    var frame = document.getElementById("appFrame");
    var loading = document.getElementById("loading");

    frame.onload = function () {

      setTimeout(function () {
        loading.classList.add("hidden");
      }, 400);

    };
  </script>

</body>
</html>
