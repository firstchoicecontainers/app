<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>First Choice Containers - Quote Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .app-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* =========================
       LOADING SCREEN
       ========================= */

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;

      background: #ffffff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      z-index: 999999;

      font-family: Arial, sans-serif;

      transition: opacity 0.3s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-size: 20px;
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
      text-align: center;
    }

    .loading-text {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;

      border: 3px solid #e5e5e5;
      border-top: 3px solid #333;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      body {
        height: 100dvh;
      }

      .app-container {
        width: 100%;
        height: 100dvh;
      }

      iframe {
        width: 105.3%;
        height: 105.3%;
        min-height: 105.3%;

        transform: scale(0.95);
        transform-origin: top left;
      }

      .loading-title {
        font-size: 18px;
      }

      .loading-text {
        font-size: 12px;
      }
    }

    /* =========================
       SMALL PHONES
       ========================= */

    @media (max-width: 480px) {

      iframe {
        width: 111.2%;
        height: 111.2%;
        min-height: 111.2%;

        transform: scale(0.90);
        transform-origin: top left;
      }

      .loading-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading">

    <div class="loading-title">
      First Choice Containers
    </div>

    <div class="loading-text">
      Loading Quote Builder...
    </div>

    <div class="spinner"></div>

  </div>


  <!-- Application -->
  <div class="app-container">

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec"
      allow="clipboard-write"
      title="First Choice Containers - Quote Builder">
    </iframe>

  </div>


  <script>
    var frame = document.getElementById("appFrame");
    var loading = document.getElementById("loading");

    frame.onload = function() {
      setTimeout(function() {
        loading.classList.add("hidden");
      }, 500);
    };
  </script>

</body>
</html>
