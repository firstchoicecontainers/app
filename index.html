<script>
  var appFrame = document.getElementById("appFrame");
  var loading = document.getElementById("loading");
  var errorScreen = document.getElementById("errorScreen");

  var loaded = false;
  var timer;


  /* =========================
     APP LOADED
     ========================= */

  appFrame.addEventListener("load", function () {

    loaded = true;

    clearTimeout(timer);

    loading.classList.add("hide");

    setTimeout(function () {
      loading.style.display = "none";
    }, 400);

  });


  /* =========================
     FALLBACK ERROR
     ========================= */

  timer = setTimeout(function () {

    if (!loaded) {

      loading.style.display = "none";

      appFrame.style.display = "none";

      errorScreen.style.display = "flex";

    }

  }, 30000);


  /* =========================
     RETRY
     ========================= */

  function retryApp() {

    loaded = false;

    clearTimeout(timer);

    errorScreen.style.display = "none";

    appFrame.style.display = "block";

    loading.style.display = "flex";
    loading.classList.remove("hide");

    appFrame.src =
      "https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec?retry=" +
      Date.now();

    timer = setTimeout(function () {

      if (!loaded) {

        loading.style.display = "none";

        appFrame.style.display = "none";

        errorScreen.style.display = "flex";

      }

    }, 30000);

  }
</script>
