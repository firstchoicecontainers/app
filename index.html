<script>

  var APP_URL =
    "https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec";

  var appFrame = document.getElementById("appFrame");
  var loading = document.getElementById("loading");
  var errorScreen = document.getElementById("errorScreen");

  var connectionTimer = null;
  var appLoaded = false;


  /* =========================
     GOOGLE APP READY
     ========================= */

  window.addEventListener("message", function(event) {

    if (event.data === "FIRST_CHOICE_APP_READY") {

      appLoaded = true;

      clearTimeout(connectionTimer);

      hideLoading();
    }

  });


  /* =========================
     IFRAME LOADED
     ========================= */

  appFrame.addEventListener("load", function() {

    appLoaded = true;

    clearTimeout(connectionTimer);

    hideLoading();

  });


  /* =========================
     HIDE LOADING
     ========================= */

  function hideLoading() {

    if (errorScreen) {
      errorScreen.style.display = "none";
    }

    loading.classList.add("hide");

    setTimeout(function() {
      loading.style.display = "none";
    }, 400);

  }


  /* =========================
     CONNECTION TIMEOUT
     ========================= */

  function startConnectionTimer() {

    clearTimeout(connectionTimer);

    connectionTimer = setTimeout(function() {

      if (!appLoaded) {

        appFrame.style.display = "none";

        loading.style.display = "none";

        errorScreen.style.display = "flex";

      }

    }, 20000);

  }


  /* =========================
     RETRY
     ========================= */

  function retryApp() {

    appLoaded = false;

    clearTimeout(connectionTimer);

    errorScreen.style.display = "none";

    loading.style.display = "flex";
    loading.classList.remove("hide");

    appFrame.style.display = "block";

    appFrame.src =
      APP_URL + "?retry=" + Date.now();

    startConnectionTimer();

  }


  /* =========================
     START
     ========================= */

  startConnectionTimer();

</script>
