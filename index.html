<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>First Choice Containers-App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    /* =========================
       APP CONTAINER
       ========================= */

    .app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* =========================
       VERSION TEXT
       ========================= */

    .version-text {
      position: fixed;
      z-index: 2147483647;

      right: 8px;
      bottom: calc(5px + env(safe-area-inset-bottom));

      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 400;

      color: #777;
      background: rgba(255, 255, 255, 0.85);

      padding: 2px 5px;
      border-radius: 3px;

      white-space: nowrap;

      pointer-events: none;
      user-select: none;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      iframe {
        width: 105.3%;
        height: 105.3%;
        min-height: 105.3%;

        transform: scale(0.95);
        transform-origin: top left;
      }

      .version-text {
        right: 6px;
        bottom: calc(4px + env(safe-area-inset-bottom));
        font-size: 8px;
      }
    }

    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 480px) {

      iframe {
        width: 111.2%;
        height: 111.2%;
        min-height: 111.2%;

        transform: scale(0.90);
        transform-origin: top left;
      }

      .version-text {
        right: 5px;
        bottom: calc(3px + env(safe-area-inset-bottom));
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- Google Apps Script App -->
  <div class="app-container">
    <iframe
      src="https://script.google.com/macros/s/AKfycbzrgdfX9R9F_duC0a8kH7DM6gMIK1UA9t392KIykDzN7eY_HnRXRsjDdjJ7p82Rp62vOg/exec"
      allow="clipboard-write"
      title="First Choice Containers-App"
      loading="eager">
    </iframe>
  </div>

</body>
</html>
